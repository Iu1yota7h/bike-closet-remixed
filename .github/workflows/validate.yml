name: Validate site
on:
  push:
    paths-ignore:
      - 'data/**'
      - 'public/catalog.json'
      - 'public/in-stock.csv'
      - 'public/status.json'
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run check:catalog
      - run: node scripts/test-discovery.mjs
      - run: npm run build
