name: Refresh catalog
on:
  schedule:
    - cron: '0 0 * * *'
      timezone: America/Los_Angeles
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: catalog-update
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'Iu1yota7h/bike-closet-remixed'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:catalog
      - run: node collect.mjs
      - run: node scripts/export-csv.mjs
      - name: Save validated data
        if: ${{ !cancelled() && success() }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/catalog.json public/in-stock.csv public/status.json data/
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh catalog'
            git push
          fi
