version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # Required by GitHub's schema; version-update PRs remain disabled below.
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      react-security:
        applies-to: security-updates
        patterns:
          - react
          - react-dom
          - react-server-dom-webpack
